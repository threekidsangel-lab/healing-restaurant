<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
:root{--cream:#fff6e8;--ink:#4a2f22;--ink2:#7a5a48;--wood:#a86f4a;--wood3:#6e4329;--lamp:#ffcf7a;--red:#d9534f}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#2b2440;font-family:'Gowun Dodum',system-ui,sans-serif;color:var(--ink);touch-action:none;-webkit-user-select:none;user-select:none}
h1,h2,h3,button,.jua{font-family:'Jua',sans-serif}
button{cursor:pointer;border:none;color:inherit;font-size:inherit;background:none;padding:0}
#c{position:fixed;inset:0;display:block;width:100%;height:100%}
.hidden{display:none!important}

.hud-tl{position:fixed;left:12px;top:12px;z-index:10;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.brand{background:rgba(58,33,20,.85);color:var(--cream);padding:8px 14px;border-radius:14px;box-shadow:0 3px 0 rgba(0,0,0,.25)}
.brand h1{margin:0;font-size:18px}
.brand small{opacity:.75;font-size:11px;font-family:'Jua'}
.pill{background:rgba(255,246,232,.92);padding:6px 12px;border-radius:999px;font-size:13px;font-family:'Jua';display:flex;align-items:center;gap:8px;box-shadow:0 2px 0 rgba(0,0,0,.15);width:max-content}
.happy .bar{width:100px;height:10px;border-radius:6px;background:#e9d6bb;overflow:hidden}
.happy .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ff9a8b,#ffcf7a);transition:width .5s}
.hud-tr{position:fixed;right:12px;top:12px;z-index:20;display:flex;gap:8px;align-items:center}
.ibtn{width:44px;height:44px;border-radius:14px;background:rgba(58,33,20,.85);color:#fff;font-size:20px;box-shadow:0 3px 0 rgba(0,0,0,.25);position:relative}
.ibtn b{position:absolute;top:-6px;right:-6px;background:var(--red);color:#fff;font-size:11px;min-width:19px;height:19px;border-radius:10px;display:grid;place-items:center;padding:0 4px;font-family:'Jua'}
.lang{display:flex;background:rgba(58,33,20,.85);border-radius:14px;padding:4px;gap:2px;box-shadow:0 3px 0 rgba(0,0,0,.25)}
.lang button{padding:8px 10px;border-radius:10px;font-size:13px;color:#e8d4bc}
.lang button.on{background:var(--lamp);color:var(--ink)}
.bump{animation:bump .35s}@keyframes bump{40%{transform:scale(1.25) rotate(-8deg)}}

#prompt{position:fixed;left:50%;bottom:150px;transform:translateX(-50%);z-index:12;background:rgba(255,246,232,.96);padding:11px 20px;border-radius:16px;font-size:17px;box-shadow:0 4px 0 #c9a37c,0 8px 20px rgba(0,0,0,.25);animation:pin .2s}
#prompt kbd{background:var(--wood3);color:#fff;border-radius:6px;padding:1px 7px;margin-right:6px;font-family:'Jua'}
@keyframes pin{from{opacity:0;transform:translate(-50%,8px)}}

#facecam{position:fixed;left:12px;top:150px;width:200px;height:200px;border-radius:22px;z-index:9;pointer-events:none;box-shadow:inset 0 0 0 5px #fff6e8,0 6px 18px rgba(0,0,0,.35)}
#facecam span{position:absolute;left:50%;bottom:-12px;transform:translateX(-50%);background:#fff6e8;font-family:'Jua';font-size:12px;padding:3px 12px;border-radius:999px;white-space:nowrap;box-shadow:0 2px 0 rgba(0,0,0,.2)}

.chat{position:fixed;left:12px;bottom:12px;z-index:10;width:min(340px,60vw);display:flex;flex-direction:column;gap:6px}
#chatlog{display:flex;flex-direction:column;gap:3px;max-height:160px;overflow:hidden;justify-content:flex-end;pointer-events:none}
#chatlog div{background:rgba(30,20,15,.55);color:#fff;padding:4px 9px;border-radius:9px;font-size:13px;width:max-content;max-width:100%;word-break:break-all;animation:pin .2s}
#chatlog div b{font-family:'Jua';font-weight:normal;margin-right:5px}
#chatlog div.sys{background:rgba(255,207,122,.8);color:var(--ink)}
#chatInput{width:100%;border:none;border-radius:12px;padding:10px 12px;font-family:inherit;font-size:14px;background:rgba(255,246,232,.95);outline:none;box-shadow:0 2px 0 rgba(0,0,0,.15)}
.emotes{display:flex;gap:4px}
.quick{display:flex;gap:4px;flex-wrap:wrap}.quick button{background:rgba(255,246,232,.92);border-radius:999px;padding:5px 10px;font-size:12px;box-shadow:0 2px 0 rgba(0,0,0,.15)}
.emotes button{width:38px;height:38px;border-radius:12px;background:rgba(255,246,232,.92);font-size:19px;box-shadow:0 2px 0 rgba(0,0,0,.15)}

#cook{position:fixed;right:12px;top:68px;bottom:12px;width:300px;z-index:11;background:rgba(255,246,232,.97);border-radius:20px;padding:14px;box-shadow:0 5px 0 #c9a37c,0 12px 30px rgba(0,0,0,.3);overflow:auto;animation:slin .3s}
@keyframes slin{from{transform:translateX(30px);opacity:0}}
#cook h3{margin:0 0 8px;font-size:18px}
.ctl{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px;align-items:center}
.seg{display:flex;gap:3px;width:100%}
.seg button{flex:1;background:#f2dfc4;padding:7px 0;border-radius:10px;font-size:13px}
.seg button.on{background:#e46b47;color:#fff}
.cbtn{background:var(--wood);color:#fff;padding:8px 10px;border-radius:11px;font-size:13px;box-shadow:0 3px 0 var(--wood3);flex:1;white-space:nowrap}
.cbtn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--wood3)}
.cbtn.alt{background:#8a9aa8;box-shadow:0 3px 0 #5c6a76}
.cbtn.go{background:#e46b47;box-shadow:0 3px 0 #a8452a}
.meter{display:flex;align-items:center;gap:6px;font-size:12px;font-family:'Jua';width:100%}
.meter .bar{flex:1;height:9px;border-radius:6px;background:#e9d6bb;overflow:hidden}
.meter .bar i{display:block;height:100%;transition:width .3s}
.sub{font-family:'Jua';font-size:14px;margin:10px 0 6px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.tile{background:#fff;border-radius:12px;padding:5px 2px;text-align:center;border:2px solid #f3e3cc;box-shadow:0 2px 0 #ead2b2;position:relative}
.tile:hover{border-color:var(--lamp)}
.tile .pic{height:32px;display:grid;place-items:center;font-size:24px}
.tile .pic .slab,.tile .pic .pitcher,.tile .pic .dish,.tile .pic .jukbowl{zoom:.55}
.tile .nm{font-family:'Jua';font-size:10.5px}
.tile b{position:absolute;top:2px;right:4px;font-family:'Jua';font-size:11px;color:var(--wood3)}
.tile.off{opacity:.38;filter:grayscale(.6)}
.empty{grid-column:1/-1;text-align:center;color:var(--ink2);font-size:12px;padding:8px 4px}
.tip{margin-top:8px;background:#fff1dc;border-radius:12px;padding:8px;font-size:12px;color:var(--ink2);line-height:1.5}
.tcups{display:flex;gap:14px;justify-content:center;align-items:flex-end;padding:4px 0 16px}
.cupw{position:relative;cursor:pointer;transition:transform .15s}
.cupw:hover{transform:translateY(-3px)}
.cupw .ct{position:absolute;left:50%;bottom:-15px;transform:translateX(-50%);font-size:10px;font-family:'Jua';white-space:nowrap;background:rgba(255,255,255,.95);padding:0 5px;border-radius:999px}

/* food pictures */
.slab{position:relative;display:inline-block;box-shadow:inset 0 -3px 0 rgba(0,0,0,.18),0 2px 3px rgba(0,0,0,.25)}
.slab.thick{width:52px;height:36px;border-radius:46% 54% 50% 44%/56% 44% 56% 44%}
.slab.thin{width:58px;height:20px;border-radius:40% 60% 45% 55%/60% 40% 60% 40%}
.slab.belly{width:58px;height:24px;border-radius:7px}
.slab.marble{background-image:radial-gradient(ellipse 6px 2.5px at 25% 35%,var(--fat) 60%,transparent 70%),radial-gradient(ellipse 8px 2.5px at 60% 60%,var(--fat) 60%,transparent 70%),radial-gradient(ellipse 4px 2px at 75% 30%,var(--fat) 60%,transparent 70%),radial-gradient(ellipse 5px 2px at 40% 75%,var(--fat) 60%,transparent 70%)}
.slab.belly{background-image:linear-gradient(0deg,transparent 0 18%,var(--fat) 18% 34%,transparent 34% 56%,var(--fat) 56% 70%,transparent 70%)}
.pitcher{width:50px;height:40px;border-radius:6px 6px 16px 16px;background:linear-gradient(90deg,#8d9099,#e6e8ec 40%,#7d808a);position:relative;box-shadow:0 3px 4px rgba(0,0,0,.35);border:2px solid #5c5f68;display:inline-block}
.pitcher i{position:absolute;left:-2px;right:-2px;top:-8px;height:16px;border-radius:50%;border:2px solid #5c5f68;box-shadow:inset 0 3px 4px rgba(0,0,0,.25)}
.pitcher:before,.pitcher:after{content:"";position:absolute;top:6px;width:9px;height:7px;background:#3b3b40;border-radius:4px}.pitcher:before{left:-9px}.pitcher:after{right:-9px}
.jukbowl{position:relative;display:inline-block;width:58px;height:40px}
.jukbowl .b{position:absolute;left:0;right:0;bottom:0;height:24px;border-radius:0 0 30px 30px;background:linear-gradient(#cfe3d6,#9fc2ae);border:2px solid #6f9a82;border-top:none}
.jukbowl .r{position:absolute;left:1px;right:1px;top:8px;height:16px;border-radius:50%;background:radial-gradient(circle at 30% 40%,#fff 0 1.5px,transparent 2px) 0 0/6px 5px,#f6f1e2;border:2px solid #6f9a82}
.jukbowl .egg{position:absolute;left:21px;top:9px;width:16px;height:12px;border-radius:50%;background:radial-gradient(circle,#ffc43a 0 4px,#fff 5px)}
.jukbowl .gim{position:absolute;width:12px;height:5px;background:#1e2a1e;border-radius:1px;top:10px}
.jukbowl .v{position:absolute;width:5px;height:5px;border-radius:1px;top:16px}
.dish{width:40px;height:40px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.25),inset 0 -2px 0 #ddd;display:inline-grid;place-items:center}
.dish i{width:26px;height:26px;border-radius:50%;display:block;box-shadow:inset 0 2px 3px rgba(0,0,0,.2)}

/* modals */
.modal{position:fixed;inset:0;z-index:30;background:rgba(40,22,14,.55);display:grid;place-items:center;padding:10px;backdrop-filter:blur(2px)}
.sheet{background:var(--cream);border-radius:22px;width:min(1000px,100%);max-height:94vh;overflow:auto;padding:16px;box-shadow:0 8px 0 #d9b994,0 20px 50px rgba(0,0,0,.4);position:relative}
.sheet .x{position:sticky;float:right;top:0;margin:-4px -4px 0 6px;width:38px;height:38px;border-radius:12px;background:#f2dfc4;font-size:18px;z-index:3}
.chefline{display:flex;gap:10px;align-items:center;margin:0 50px 18px 0}
.chefline .f{font-size:40px}
.chefline .bub{background:#fff;border-radius:14px;padding:10px 14px;flex:1;box-shadow:0 2px 0 #ead2b2}
.shoplay{display:grid;grid-template-columns:1fr 250px;gap:14px;align-items:start}
@media(max-width:820px){
 .brand h1{font-size:14px}.brand small{display:none}.brand{padding:6px 10px}
 .hud-tl{gap:5px}.hud-tl .pill{font-size:11px;padding:4px 9px}.happy .bar{width:56px}
 .hud-tr{gap:5px}.ibtn{width:38px;height:38px;font-size:17px;border-radius:12px}.lang{padding:3px}.lang button{padding:6px 7px;font-size:11px}
 #facecam{width:104px;height:104px;top:112px;border-radius:16px}#facecam span{font-size:10px;padding:2px 8px}
 #cook{left:8px;right:8px;width:auto;top:auto;bottom:8px;max-height:44vh;padding:10px 12px;border-radius:18px}
 #cook.min{max-height:52px;overflow:hidden}
 .minbtn{display:block!important}
 .modal{padding:0}.sheet{max-height:100vh;height:100%;border-radius:0;padding:12px}
 .chefline{margin-bottom:10px}.chefline .f{font-size:30px}.chefline .bub{padding:7px 10px;font-size:13px}
 .shoplay{grid-template-columns:1fr;gap:10px}
 .buffet{gap:22px 8px;padding:20px 6px 8px}.tray{height:150px}.tray .items{inset:20px 10px 12px}.pile{min-height:42px}.pile .cp{font-size:22px}.pile .tp{font-size:9.5px}
 .potbox{position:sticky;bottom:-12px;z-index:5;padding:8px 10px;box-shadow:0 -6px 16px rgba(0,0,0,.18)}
 .potbox .mypot,.potbox .tip,.potbox [data-close="shop"]{display:none}
 .potbox .blist{max-height:64px;font-size:12px}.potbox h3{font-size:14px}
 .zonebtns{display:flex;gap:6px}.zonebtns .donebtn{font-size:14px;padding:10px 6px}
 .drinklay{gap:10px}.machine{transform:scale(.82);transform-origin:top center;margin-bottom:-78px}
}
@media(max-width:520px){.brand{display:none}.hud-tl{top:60px}#facecam{top:150px}}
.minbtn{display:none;position:absolute;right:10px;top:8px;width:34px;height:30px;border-radius:10px;background:#f2dfc4;font-size:14px}
#cook{position:fixed}
#chatToggle{display:none}
body.touch #chatToggle{display:block}
body.touch .chat{left:10px;right:auto;width:min(300px,62vw);bottom:150px;pointer-events:none}
body.touch .chat .emotes,body.touch .chat .quick,body.touch #chatInput{display:none}
body.touch #chatlog{max-height:52px}body.touch #chatlog div{font-size:11px;padding:3px 7px}
body.touch.chatopen .chat{left:8px;right:8px;width:auto;bottom:8px;pointer-events:auto;background:rgba(40,25,18,.55);padding:8px;border-radius:16px;z-index:25}
body.touch.chatopen .chat .emotes,body.touch.chatopen .chat .quick{display:flex}body.touch.chatopen #chatInput{display:block}
body.touch.chatopen #chatlog{max-height:120px}
body.touch.chatopen #joy,body.touch.chatopen #jump,body.cooking #joy,body.cooking #jump{display:none!important}
body.cooking.touch .chat{bottom:calc(44vh + 16px)}
body.cooking.touch.cookmin .chat{bottom:70px}
#ssamFx{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%);z-index:45;pointer-events:none;width:200px;height:160px}
#ssamFx .leaf{position:absolute;left:50%;top:50%;font-size:110px;transform:translate(-50%,-50%) scale(0);animation:leafIn 1.4s forwards}
#ssamFx .meat{position:absolute;left:50%;top:-30px;transform:translateX(-50%);animation:meatIn 1.4s forwards}
#ssamFx .yum{position:absolute;left:50%;bottom:-30px;transform:translateX(-50%);font-family:'Jua';font-size:26px;color:#fff;text-shadow:0 2px 0 #3a7a2a,0 0 12px rgba(0,0,0,.4);white-space:nowrap;opacity:0;animation:yumIn 1.4s forwards}
@keyframes leafIn{0%{transform:translate(-50%,-50%) scale(0) rotate(-20deg)}25%{transform:translate(-50%,-50%) scale(1.1) rotate(0)}55%{transform:translate(-50%,-50%) scale(1)}75%{transform:translate(-50%,-50%) scale(.55,1) rotate(8deg)}100%{transform:translate(-50%,-130%) scale(.3);opacity:0}}
@keyframes meatIn{0%{top:-40px;opacity:0}20%{opacity:1}45%{top:52px}75%{top:52px;transform:translateX(-50%) scale(.6)}100%{top:10px;opacity:0;transform:translateX(-50%) scale(.2)}}
@keyframes yumIn{0%,55%{opacity:0;transform:translateX(-50%) scale(.5)}70%{opacity:1;transform:translateX(-50%) scale(1.15)}100%{opacity:0;transform:translateX(-50%) translateY(-20px)}}
.ssamrow{display:flex;gap:6px;flex-wrap:wrap}.ssamrow button{flex:1;background:#eaf6df;border:2px solid #b8dca0;border-radius:12px;padding:7px 4px;font-size:13px}
.ssamrow button.on{background:#5aa63e;color:#fff;border-color:#3e7a2a}
.buffet{background:linear-gradient(#b67a50,#94603d);border-radius:22px;padding:24px 12px 12px;display:flex;flex-wrap:wrap;gap:26px 12px;justify-content:center;box-shadow:inset 0 6px 0 rgba(255,255,255,.18),0 8px 0 #6e4329}
.tray{position:relative;width:min(298px,100%);height:190px;border-radius:44% 44% 40% 40%/30% 30% 26% 26%;background:radial-gradient(ellipse at 50% 40%,#e9c58f,#c99558 70%,#a8733e);box-shadow:inset 0 -8px 0 rgba(0,0,0,.18),inset 0 5px 0 rgba(255,255,255,.35),0 6px 10px rgba(0,0,0,.25)}
.tray.cream{background:radial-gradient(ellipse at 45% 35%,#fbf3e4,#e8d6b8 65%,#c9ad84)}
.tray .lbl{position:absolute;left:50%;top:-14px;transform:translateX(-50%);background:#6e4329;color:#fff;font-family:'Jua';font-size:14px;padding:3px 12px;border-radius:999px;white-space:nowrap;box-shadow:0 2px 0 #3a2114;z-index:2}
.tray .items{position:absolute;inset:22px 14px 16px;display:grid;gap:2px;align-items:center;justify-items:center}
.pile{position:relative;width:100%;height:100%;min-height:58px;transition:transform .15s;display:grid;place-items:center}
.pile:hover{transform:translateY(-4px) scale(1.07)}
.pile:active{transform:scale(.95)}
.pile .cp{position:absolute;font-size:28px;line-height:1;filter:drop-shadow(0 2px 1px rgba(0,0,0,.3))}
.pile .tp{position:absolute;bottom:-3px;left:50%;transform:translateX(-50%);font-size:10.5px;font-family:'Jua';background:rgba(255,255,255,.9);padding:0 6px;border-radius:999px;white-space:nowrap;box-shadow:0 1px 0 rgba(0,0,0,.15)}
.pile:hover .tp{background:var(--lamp)}
.potbox{background:#fff;border-radius:18px;padding:12px;box-shadow:0 3px 0 #ead2b2;position:sticky;top:0}
.mypot{position:relative;height:150px;margin:6px auto 4px;width:190px;cursor:pointer}
.mypot .pile-in{position:absolute;left:12px;right:12px;bottom:58px;height:70px;pointer-events:none}
.mypot .pile-in span{position:absolute;font-size:22px;line-height:1;filter:drop-shadow(0 1px 1px rgba(0,0,0,.3))}
.mypot .cnt{position:absolute;right:-2px;top:28px;background:var(--red);color:#fff;font-family:'Jua';font-size:13px;min-width:24px;height:24px;border-radius:12px;display:grid;place-items:center;padding:0 5px}
.wiggle{animation:wig .4s}@keyframes wig{30%{transform:rotate(-6deg) scale(1.06)}60%{transform:rotate(5deg)}}
.blist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;max-height:200px;overflow:auto;font-size:13px}
.blist li{display:flex;align-items:center;gap:5px;padding:3px 2px;border-bottom:1px dashed #eedcc4}
.blist .mini{width:30px;display:grid;place-items:center}
.blist .q{margin-left:auto;display:flex;gap:4px;align-items:center;font-family:'Jua'}
.qb{width:22px;height:22px;border-radius:7px;background:#f2dfc4}
.sets{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.sets button{background:#fff;border:2px dashed var(--wood);padding:6px 10px;border-radius:12px;font-size:13px;color:var(--wood3)}
.donebtn{width:100%;margin-top:10px;background:linear-gradient(#ffb85a,#f39a2e);color:#fff;font-size:16px;padding:11px;border-radius:14px;box-shadow:0 4px 0 #c47414}
.flyer{position:fixed;z-index:999;pointer-events:none;display:grid;place-items:center}
/* drink machine */
.drinklay{display:flex;gap:20px;flex-wrap:wrap;justify-content:center;align-items:flex-start}
.machine{position:relative;width:316px;height:430px;border-radius:26px 26px 14px 14px;background:linear-gradient(#e86b4a,#c9502f);box-shadow:inset 0 6px 0 rgba(255,255,255,.25),0 10px 0 #8a3420}
.machine .top{position:absolute;left:16px;right:16px;top:12px;height:44px;border-radius:14px;background:#fff6e8;display:grid;place-items:center;font-family:'Jua';font-size:20px;color:#c9502f;letter-spacing:1px}
.dbtns{position:absolute;left:16px;right:16px;top:66px;display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.dbtn{background:#fff6e8;border-radius:12px;padding:6px 0 5px;display:flex;flex-direction:column;align-items:center;gap:2px;box-shadow:0 3px 0 #8a3420;font-size:11px}
.dbtn .ic{font-size:24px}
.dbtn:active{transform:translateY(2px);box-shadow:0 1px 0 #8a3420}
.dbtn .sw{width:26px;height:6px;border-radius:3px}
.nozzles{position:absolute;left:30px;right:30px;top:150px;display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.nozzles i{background:linear-gradient(#999,#666);border-radius:0 0 8px 8px;width:20px;height:24px;justify-self:center}
.slot{position:absolute;left:24px;right:24px;top:180px;height:200px;border-radius:12px;background:linear-gradient(#3a2a2e,#2a1e22);box-shadow:inset 0 6px 14px rgba(0,0,0,.6)}
.drip{position:absolute;left:24px;right:24px;top:370px;height:22px;border-radius:6px;background:repeating-linear-gradient(90deg,#8a8d96 0 6px,#6c6f78 6px 10px)}
.stream{position:absolute;width:8px;border-radius:4px;top:204px;height:0;opacity:0}
.stream.go{animation:stream 1.6s ease-in-out}

.cupsbox{background:#fff;border-radius:18px;padding:14px;min-width:240px;box-shadow:0 3px 0 #ead2b2;text-align:center}
#mycups{display:flex;gap:18px;justify-content:center;align-items:flex-end;min-height:110px;padding-bottom:16px}

.cover{position:fixed;inset:0;z-index:50;background:radial-gradient(ellipse at 50% 20%,rgba(255,190,110,.35),transparent 60%),rgba(40,22,30,.84);display:grid;place-items:center;padding:14px}
.ccard{background:var(--cream);border-radius:24px;padding:22px;width:min(440px,100%);text-align:center;box-shadow:0 10px 0 #d9b994,0 24px 60px rgba(0,0,0,.5)}
.ccard h2{margin:4px 0 0;font-size:25px}
.ccard .en{font-family:'Jua';color:#c9502f;letter-spacing:1px}
.ccard p{color:var(--ink2);line-height:1.6;margin:10px 0 14px;font-size:14px}
.ccard input{width:100%;border:2px solid #ead2b2;border-radius:12px;padding:11px;font-size:16px;font-family:inherit;text-align:center;outline:none}
.swatches{display:flex;gap:8px;justify-content:center;margin:12px 0 16px}
.swatches button{width:34px;height:34px;border-radius:50%;border:3px solid transparent;box-shadow:0 2px 0 rgba(0,0,0,.2)}
.swatches button.on{border-color:var(--ink);transform:scale(1.12)}
.enter{background:linear-gradient(#ffb85a,#f39a2e);color:#fff;font-size:20px;padding:12px 30px;border-radius:16px;box-shadow:0 4px 0 #c47414}

.keys kbd{background:#efe0c8;border-radius:5px;padding:1px 6px;font-family:'Jua';color:var(--ink)}
#toasts{position:fixed;left:50%;top:70px;transform:translateX(-50%);z-index:40;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;width:min(480px,92vw)}
.toast{background:rgba(58,33,20,.93);color:var(--cream);padding:10px 16px;border-radius:14px;font-size:14px;box-shadow:0 6px 16px rgba(0,0,0,.25);animation:pin2 .3s,tout .4s 2.8s forwards;text-align:center}

@keyframes tout{to{opacity:0;transform:translateY(-6px)}}
#joy{position:fixed;left:22px;bottom:22px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.18);border:2px solid rgba(255,255,255,.35);z-index:9;touch-action:none}

#loading{position:fixed;inset:0;display:grid;place-items:center;color:#fff;font-family:'Jua';font-size:20px;z-index:60;background:#2b2440}

function seatRoute(tb,i){const sp=seatPos(tb,i),[br,fr]=rowsFor(tb),ap=[sp.x+sp.ox*.55,sp.z+sp.oz*.55];if(sp.oz<0)return{entry:[sp.x,br],goal:ap};if(fr!==null)return{entry:[sp.x,fr],goal:ap};return{entry:[Math.sign(tb.x)*5.6,11.2],goal:[sp.x,11.2]}}

  const rim=new THREE.Mesh(new THREE.TorusGeometry(.34,.012,6,40),potM);rim.rotation.x=Math.PI/2;rim.position.y=1.03;grp.add(rim);

  tb.glowM=glowM;tb.broth=broth;tb.brothM=brothM;
  const jg=new THREE.Group();jg.visible=false;grp.add(jg);
  const bit=(geo,c,n,y)=>{const m=mat(c);for(let i=0;i<n;i++){const ms=new THREE.Mesh(geo,m);const a=Math.random()*6.28,r=Math.sqrt(Math.random())*.27;ms.position.set(Math.cos(a)*r,y,Math.sin(a)*r);ms.rotation.y=Math.random()*6;jg.add(ms)}};
  bit(new THREE.BoxGeometry(.014,.006,.008),'#ffffff',38,.004);bit(new THREE.SphereGeometry(.028,10,6),'#ffd23a',5,0);bit(new THREE.CircleGeometry(.03,10),'#fffaf0',4,-.001);
  bit(new THREE.BoxGeometry(.045,.003,.022),'#1e2a1e',10,.006);bit(new THREE.BoxGeometry(.016,.01,.016),'#5aa63e',8,.005);bit(new THREE.BoxGeometry(.015,.01,.015),'#f08a3a',6,.005);

  const liqM=new THREE.MeshStandardMaterial({color:'#4a2416',roughness:.3});const liq=new THREE.Mesh(new THREE.CylinderGeometry(.046,.04,1,16),liqM);g.add(liq);

const readyTex=canvasTex(64,64,g=>{g.font='48px sans-serif';g.textAlign='center';g.textBaseline='middle';g.fillText('😋',32,36)});
function buildFood(it){
 const g=new THREE.Group(),base=[],fat=[];const M=c=>new THREE.MeshStandardMaterial({color:c,roughness:.6});
 const add=(geo,m,x=0,y=0,z=0,rx=0,rz=0)=>{const ms=new THREE.Mesh(geo,m);ms.position.set(x,y,z);ms.rotation.x=rx;ms.rotation.z=rz;ms.castShadow=true;g.add(ms);return ms};
 if(it.cat==='meat'&&!it.m3){const bm=M(it.raw);base.push(bm);const fm=M(it.fat?it.fat[0]:'#fff');fat.push(fm);
  if(it.shape==='thick'){add(new THREE.BoxGeometry(.17,.03,.12),bm);[[-.04,-.02],[.03,.02],[.05,-.03]].forEach(([x,z])=>add(new THREE.BoxGeometry(.04,.032,.01),fm,x,0,z))}
  else if(it.shape==='thin'){add(new THREE.BoxGeometry(.2,.012,.08),bm);[[-.05,0],[.04,.015],[.06,-.02]].forEach(([x,z])=>add(new THREE.BoxGeometry(.045,.014,.008),fm,x,0,z))}
  else{add(new THREE.BoxGeometry(.2,.022,.085),bm);[-.022,.018].forEach(z=>add(new THREE.BoxGeometry(.202,.024,.014),fm,0,0,z))}
 }else{const m=M(it.raw);base.push(m);
  switch(it.m3){
   case'shrimp':add(new THREE.TorusGeometry(.045,.018,8,16,Math.PI*1.4),m,0,.01,0,Math.PI/2);break;
   case'mushroom':add(new THREE.SphereGeometry(.055,14,8,0,Math.PI*2,0,Math.PI/2),m);add(new THREE.CylinderGeometry(.04,.04,.01,12),M('#efe2c8'));break;
   case'onion':add(new THREE.TorusGeometry(.05,.016,8,20),m,0,.01,0,Math.PI/2);break;
   case'garlic':add(new THREE.SphereGeometry(.032,10,8),m,0,.02,0);break;
   case'corn':add(new THREE.CylinderGeometry(.035,.035,.16,12),m,0,.03,0,0,Math.PI/2);break;
   case'potato':add(new THREE.CylinderGeometry(.05,.05,.025,16),m,0,.01,0);break;
   case'pepper':add(new THREE.CylinderGeometry(.018,.012,.14,8),m,0,.018,0,0,Math.PI/2);break;
   case'cabbage':add(new THREE.BoxGeometry(.13,.012,.09),m);break;
   case'broccoli':add(new THREE.IcosahedronGeometry(.045,1),m,0,.03,0);break;
   case'pumpkin':add(new THREE.BoxGeometry(.11,.03,.06),m);break;
   case'noodle':for(let k=0;k<7;k++){const n=add(new THREE.TorusGeometry(.03+k*.006,.004,5,18,Math.PI*1.6),m,(k%3-1)*.01,.008+k*.002,(k%2)*.01,Math.PI/2);n.rotation.z=k}break;
   case'scallion':add(new THREE.CylinderGeometry(.012,.012,.17,8),m,0,.012,0,0,Math.PI/2);break;
   default:add(new THREE.BoxGeometry(.1,.03,.1),m);
  }}
 const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:readyTex,transparent:true,depthWrite:false}));sp.scale.set(.09,.09,1);sp.position.y=.1;sp.visible=false;g.add(sp);
 g.userData={base,fat,ready:sp};return g;
}
function disposeObj(o){o.traverse(c=>{if(c.geometry)c.geometry.dispose();if(c.material&&!Array.isArray(c.material))c.material.dispose()})}

function renderTable(tb,st,ownerKey,dt,now){
 if(tb.owner!==ownerKey){for(const v of tb.vis.values()){tb.food.remove(v.obj);disposeObj(v.obj)}tb.vis.clear();tb.owner=ownerKey}
 const seen=new Set(),items=(st&&Array.isArray(st.it))?st.it:[];
 // cups
 const cu=(st&&Array.isArray(st.cu))?st.cu:[];
 tb.cupG.forEach((c,i)=>{const a=cu[i];if(!Array.isArray(a)){c.g.visible=false;return}const d=DRINKS[a[0]|0];if(!d){c.g.visible=false;return}const lv=clamp(+a[1]||0,0,100)/100;c.g.visible=true;c.liqM.color.set(d.color==='#cfe9ff'?'#bfe3ff':d.color);c.liq.scale.y=Math.max(.001,.13*lv);c.liq.position.y=.065*lv+.003;c.liq.visible=lv>0;c.straw.visible=!d.hot;c.glass.material.color.set(d.hot?'#ffffff':'#e6f4ff');c.glass.material.opacity=d.hot?.95:.45});
 if(tb.type==='grill'){
  const h=st?clamp(+st.h||0,0,3):0;tb.coal.emissiveIntensity+=(([0,.5,.9,1.4][h]||0)-tb.coal.emissiveIntensity)*.1;
  for(const a of items){if(!Array.isArray(a))continue;const[u,i,slot,p,fl,rd]=a;const it=ITEMS[i];if(!it||it.cat==='broth'||it.cat==='sauce')continue;
   const key=String(u);seen.add(key);let v=tb.vis.get(key);const s=GSLOTS[clamp(slot|0,0,GSLOTS.length-1)];
   if(!v){const obj=buildFood(it);obj.position.set(s[0],.95,s[1]);obj.rotation.y=rnd(u)*Math.PI*2;obj.userData.uid=u;tb.food.add(obj);v={obj,fl,flipT:1};tb.vis.set(key,v)}
   if(fl!==v.fl){v.fl=fl;v.flipT=0}
   if(v.flipT<1){v.flipT=Math.min(1,v.flipT+dt*2.4);v.obj.position.y=.95+Math.sin(Math.PI*v.flipT)*.09;v.obj.rotation.x=Math.PI*v.flipT;if(v.flipT>=1)v.obj.rotation.x=0}
   v.obj.position.x=s[0];v.obj.position.z=s[1];const pp=+p||0;
   v.obj.userData.base.forEach(m=>m.color.set(doneColor(it,pp)));v.obj.userData.fat.forEach(m=>m.color.set(fatColor(it,pp)));
   v.obj.userData.ready.visible=!!rd;v.obj.userData.ready.position.y=.1+Math.sin(now*.005+u)*.012}
  const n=items.length;
  for(const s of tb.fx){if(s.userData.life>0){s.userData.life-=dt;const k=1-s.userData.life/2.2;s.position.y=1+k*1.1;s.position.x+=s.userData.dx*dt;s.scale.setScalar(.2+k*.7);s.material.opacity=(1-k)*.35*(s.userData.dark?1.6:1);if(s.userData.life<=0)s.visible=false}
   else if(h>0&&n>0&&Math.random()<dt*(.4+n*.1)*h){const a=items[Math.floor(Math.random()*n)];const sl=GSLOTS[clamp((a&&a[2])|0,0,GSLOTS.length-1)];s.visible=true;s.userData.life=2.2;s.userData.dx=(Math.random()-.5)*.15;s.userData.dark=a&&a[6]===1;s.material.color.set(s.userData.dark?'#555':'#fff');s.position.set(sl[0],1,sl[1])}}
 }else{
  const b=st?(st.b|0):-1,l=st?clamp(+st.l||0,0,100):0,tp=st?clamp(+st.t||20,0,100):20,pw=st?!!st.pw:false,br=ITEMS[b];
  tb.glowM.emissiveIntensity+=((pw?1.2:0)-tb.glowM.emissiveIntensity)*.08;
  if(br&&br.cat==='broth'&&l>0){tb.broth.visible=true;tb.brothM.color.set(br.color);tb.broth.position.y=.845+.14*l/100}else tb.broth.visible=false;
  const sy=tb.broth.position.y;
  const jj=st&&Array.isArray(st.j)?st.j:null;
  tb.jukG.visible=!!jj&&tb.broth.visible;
  if(tb.jukG.visible){const jp=clamp(+jj[0]||0,0,200);tb.brothM.color.set(lerpHex(br.color,'#efe0b4',Math.min(1,(jp+35)/100)));tb.jukG.position.y=sy+.003;tb.jukG.rotation.y=+jj[1]||0}
  for(const a of items){if(!Array.isArray(a))continue;const[u,i,x,z,p]=a;const it=ITEMS[i];if(!it||it.cat==='broth'||it.cat==='sauce')continue;
   const key=String(u);seen.add(key);let v=tb.vis.get(key);
   if(!v){const obj=buildFood(it);obj.rotation.y=rnd(u)*Math.PI*2;obj.userData.uid=u;tb.food.add(obj);v={obj};tb.vis.set(key,v);obj.position.y=sy+.25}
   const px=clamp((+x||0)/100,-.25,.25),pz=clamp((+z||0)/100,-.25,.25),wob=tp>80?Math.sin(now*.004+u)*.008:0;
   v.obj.position.x=px+wob;v.obj.position.z=pz;v.obj.position.y+=((sy+.005+Math.sin(now*.003+u*2)*.006)-v.obj.position.y)*.12;v.obj.rotation.z=Math.sin(now*.002+u)*.12;
   const pp=+p||0,ck=it.shabuCooked||it.cooked,col=pp<=100?lerpHex(it.raw,ck,pp/100):lerpHex(ck,'#7b6458',Math.min(1,(pp-100)/200)*(it.cat==='meat'?1:.4));
   v.obj.userData.base.forEach(m=>m.color.set(col));v.obj.userData.fat.forEach(m=>m.color.set(lerpHex(it.fat?it.fat[0]:'#ffffff','#e8dccf',pp/100)));
   v.obj.userData.ready.visible=pp>=100;v.obj.userData.ready.position.y=.1+Math.sin(now*.005+u)*.012}
  const inten=tb.broth.visible?Math.max(0,(tp-55)/45):0;
  for(const bu of tb.fx){if(bu.userData.life>0){bu.userData.life-=dt;const k=1-bu.userData.life/bu.userData.max;bu.scale.setScalar(.4+k*1.2);bu.position.y=sy+.004;if(bu.userData.life<=0)bu.visible=false}
   else if(inten>0&&Math.random()<dt*inten*5){const ang=Math.random()*6.28,r=Math.sqrt(Math.random())*.28;bu.position.set(Math.cos(ang)*r,sy,Math.sin(ang)*r);bu.userData.max=bu.userData.life=.3+Math.random()*.5;bu.visible=true}}
  for(const s of tb.steam){if(s.userData.life>0){s.userData.life-=dt;const k=1-s.userData.life/3;s.position.y=sy+.1+k*1.2;s.position.x+=s.userData.dx*dt;s.scale.setScalar(.25+k*.8);s.material.opacity=(1-k)*.3;if(s.userData.life<=0)s.visible=false}
   else if(inten>.15&&Math.random()<dt*inten*1.3){s.visible=true;s.userData.life=3;s.userData.dx=(Math.random()-.5)*.12;s.position.set((Math.random()-.5)*.4,sy+.1,(Math.random()-.5)*.4)}}
 }
 for(const[k,v]of tb.vis){if(!seen.has(k)){tb.food.remove(v.obj);disposeObj(v.obj);tb.vis.delete(k)}}
}

/* =================== AVATARS & FACES =================== */
function faceCanvas(kind){return canvasTex(128,128,(g,w,h)=>{
 const ink='#2a1a12';g.strokeStyle=ink;g.fillStyle=ink;g.lineCap='round';g.lineJoin='round';
 const happyEyes=(y)=>{g.lineWidth=6;g.beginPath();g.moveTo(32,y+4);g.quadraticCurveTo(42,y-8,52,y+4);g.moveTo(76,y+4);g.quadraticCurveTo(86,y-8,96,y+4);g.stroke()};
 const blush=(r,a)=>{g.fillStyle=`rgba(255,110,120,${a})`;g.beginPath();g.ellipse(28,80,r,r*.7,0,0,7);g.ellipse(100,80,r,r*.7,0,0,7);g.fill()};
 if(kind==='normal'||kind==='blink'){
  if(kind==='normal'){g.beginPath();g.ellipse(42,56,8,11,0,0,7);g.ellipse(86,56,8,11,0,0,7);g.fill();g.fillStyle='#fff';g.beginPath();g.arc(45,52,3,0,7);g.arc(89,52,3,0,7);g.fill()}
  else{g.lineWidth=5;g.beginPath();g.moveTo(34,58);g.lineTo(50,58);g.moveTo(78,58);g.lineTo(94,58);g.stroke()}
  g.lineWidth=5;g.beginPath();g.arc(64,74,14,.25,Math.PI-.25);g.stroke();blush(9,.45);
 }else if(kind==='yum'){ // big open mouth, delighted
  happyEyes(54);blush(12,.7);
  g.fillStyle='#8a2a2a';g.beginPath();g.moveTo(42,70);g.quadraticCurveTo(64,66,86,70);g.quadraticCurveTo(84,104,64,106);g.quadraticCurveTo(44,104,42,70);g.closePath();g.fill();g.lineWidth=4;g.stroke();
  g.fillStyle='#ff8a9a';g.beginPath();g.ellipse(64,96,13,8,0,0,7);g.fill();
  g.fillStyle='#fff';g.fillRect(50,70,28,6);
  g.fillStyle='#ffd23a';[[16,30,6],[110,26,5],[112,46,3]].forEach(([x,y,r])=>{g.beginPath();for(let i=0;i<8;i++){const a=i*Math.PI/4,rr2=i%2?r*.4:r;g.lineTo(x+Math.cos(a)*rr2,y+Math.sin(a)*rr2)}g.closePath();g.fill()});
 }else if(kind==='chew'){ // puffed cheeks, closed mouth

function findPath(sx,sz,entry,goal){
 if(Math.hypot(goal[0]-sx,goal[1]-sz)<1.6)return[goal];

 const prev=new Map([[a,null]]),q=[a];
 while(q.length){const n=q.shift();if(n===b)break;[[1,0],[-1,0],[0,1],[0,-1]].forEach(([di,dj])=>{const m=nodeAt(n.i+di,n.j+dj);if(m&&!prev.has(m)){prev.set(m,n);q.push(m)}})}
 const path=[];let c=b;while(c){path.unshift([c.x,c.z]);c=prev.get(c)}
 path.push(entry,goal);return path;
}

 room.presence({n:me.name,c:me.color,x:+me.x.toFixed(2),z:+me.z.toFixed(2),y:+me.y.toFixed(2),r:+me.r.toFixed(2),w:me.walking?1:0,s:me.seated?1:0,o:me.own||0,st:me.seat?[me.seat.tid,me.seat.idx]:0,rq:me.rq,ak:me.own?acks:[],hj:Math.round(me.happy),tb:myCompact(),say:me.say,sayT:me.sayT,e:me.e,eT:me.eT,ea:me.ea,sp:me.sp,hp:potCount()>0&&mode==='walk'?1:0,hc:cups.length&&mode==='walk'?cups[0].d:-1}).catch(()=>{});
}
async function firebaseRoom(cfg){

 const id=Date.now().toString(36)+Math.random().toString(36).slice(2,8);const size=cfg.roomSize||12;let roomNo=1;
 for(let r=1;r<=30;r++){try{const sn=await db.ref('hr/rooms/r'+r+'/p').once('value');if(sn.numChildren()<size){roomNo=r;break}}catch(e){break}}

 function fire(){cache=null;if(fireQ)return;fireQ=true;setTimeout(()=>{fireQ=false;const ps=peersArr();peerHs.forEach(h=>{try{h({peers:ps,joined:[],left:[],updated:[]})}catch(e){console.error(e)}})},30)}
 roomRef.on('child_added',s=>{if(s.key===id)return;state.set(s.key,s.val()||{});fire()});
 roomRef.on('child_changed',s=>{if(s.key===id)return;state.set(s.key,s.val()||{});fire()});

 const tbKey=tb=>{if(!tb)return'';const it=(tb.it||[]).map(a=>a.length>5?[a[0],a[2],a[4],a[5],a[6]]:[a[0],(a[4]>=100)?1:0]);return JSON.stringify([tb.h,tb.b,tb.pw,tb.cu&&tb.cu.map(c=>[c[0],Math.round(c[1]/25)]),tb.j&&[tb.j[2],tb.j[3],tb.j[0]>=100],it])};
 const js=v=>JSON.stringify(v===undefined?null:v);

  const take=k=>{const v=JSON.parse(js(mine[k]));upd[k]=v;sentStr[k]=js(v);if(k==='tb'){sentTbKey=tbKey(mine.tb);lastTb=now}if(POS[k])lastPos=now};
  if(force||imp){for(const k in mine)if(js(mine[k])!==sentStr[k])take(k)}

  presence(patch){mine=Object.assign({},mine);for(const k in patch){if(patch[k]===null)delete mine[k];else mine[k]=patch[k]}cache=null;flush(false);return Promise.resolve()},
  onPeers(h){peerHs.push(h);setTimeout(()=>h({peers:peersArr(),joined:[],left:[],updated:[]}),0);return()=>{}},
  peers:peersArr,connected:()=>connected,
  onConnection(h){connHs.push(h);setTimeout(()=>h(connected),0);return()=>{}}};

  myAv.potC.visible=potCount()>0&&mode==='walk';myAv.cupC.visible=cups.length>0&&mode==='walk';if(cups[0])myAv.cupLiqM.color.set(DRINKS[cups[0].d].color);
  myAv.root.position.set(me.x,me.y,me.z);myAv.root.rotation.y=me.r;animAvatar(myAv,dt,me.walking&&me.y<=0,me.seated,run?1.4:1);tickAvatarFx(myAv,dt,now);
 }
 // cooking sim

 for(const p of grill.pieces){if(mul>0){p.sides[p.bottom]+=ITEMS[p.i].rate*mul*dt;p.sides[1-p.bottom]+=.6*mul*dt}const st=stateOf(p);if(st!=='raw'&&!p.dinged){p.dinged=true;if(st!=='burnt'&&mode==='cook')ding()}}
 if(spot.power&&spot.level>0)spot.temp=Math.min(100,spot.temp+9*dt);else spot.temp=Math.max(20,spot.temp-2.2*dt);

 let grillI=0,shabuI=0;const ct=curTable(),lx=mode==='cook'&&ct?ct.x:me.x,lz=mode==='cook'&&ct?ct.z:me.z;

 else{const target=new THREE.Vector3(me.x,me.y+1.5,me.z);camT.lerp(target,.2);tmpV.set(camT.x+Math.sin(yaw)*Math.cos(pitch)*dist,camT.y+Math.sin(pitch)*dist,camT.z+Math.cos(yaw)*Math.cos(pitch)*dist);tmpV.y=Math.max(.4,tmpV.y);camera.position.lerp(tmpV,.25)}

 {const ce=$('#cook'),ph=(mode==='cook'&&innerWidth<=820&&ce&&!ce.classList.contains('hidden'))?ce.offsetHeight+8:0,key=innerWidth+'x'+innerHeight+'/'+ph;

 // main render (hide my avatar when the camera sits above my seat)
